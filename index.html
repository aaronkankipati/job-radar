<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Radar · Signal Acquisition</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #060b0e;
    --bg-card: rgba(8, 18, 24, 0.9);
    --bg-card-hover: rgba(12, 27, 35, 0.96);
    --green: #00e87a;
    --green-dim: rgba(0, 232, 122, 0.14);
    --amber: #ffaa00;
    --red: #ff5544;
    --ice: #7dd8ff;
    --ink: #d8f0e8;
    --ink-dim: #6a8f80;
    --ink-faint: #34504a;
    --line: rgba(0, 232, 122, 0.1);
    --line-bright: rgba(0, 232, 122, 0.24);
    --radar-size: 264px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink); min-height: 100vh; background: var(--bg);
    -webkit-font-smoothing: antialiased;
    position: relative; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      transparent 0 2px, rgba(0,0,0,0.09) 2px 4px);
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(rgba(0,232,122,0.09) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 22%, #000 25%, transparent 78%);
    mask-image: radial-gradient(ellipse 75% 70% at 50% 22%, #000 25%, transparent 78%);
  }
  .wrap {
    position: relative; z-index: 1;
    max-width: 680px; margin: 0 auto; padding: 24px 16px 70px;
  }

  /* header */
  header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 26px; padding-bottom: 15px;
    border-bottom: 1px solid var(--line-bright); position: relative;
  }
  header::after {
    content: ''; position: absolute; bottom: -1px; left: 0;
    width: 64px; height: 1px; background: var(--green);
    box-shadow: 0 0 12px var(--green);
  }
  .logo {
    font-family: 'Aldrich', sans-serif;
    font-size: 23px; letter-spacing: 0.17em; color: var(--ink);
    display: flex; align-items: center; gap: 9px;
  }
  .logo-cursor {
    display: inline-block; width: 3px; height: 21px;
    background: var(--green); box-shadow: 0 0 8px var(--green);
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .logo-sub {
    font-size: 8.5px; letter-spacing: 0.13em; color: var(--ink-faint);
    text-transform: uppercase; margin-top: 6px;
  }
  .header-right { text-align: right; }
  .mode-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--green); border: 1px solid var(--green-dim);
    padding: 4px 9px; margin-bottom: 9px;
  }
  .mode-dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  .stat-pills { display: flex; gap: 11px; justify-content: flex-end; flex-wrap: wrap; }
  .pill { font-size: 8.5px; letter-spacing: 0.07em; color: var(--ink-dim); text-transform: uppercase; }
  .pill b { color: var(--ink); font-weight: 500; }

  /* radar */
  .radar-section {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 34px; gap: 18px;
  }
  .radar-wrap {
    position: relative; width: var(--radar-size); height: var(--radar-size);
    flex-shrink: 0;
  }
  .radar-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sweep, .sweep-trail {
    position: absolute; inset: 0; border-radius: 50%;
    animation: radar-sweep 4s linear infinite;
  }
  .sweep {
    background: conic-gradient(from 0deg,
      transparent 0 334deg,
      rgba(0,232,122,0.03) 342deg,
      rgba(0,232,122,0.09) 350deg,
      rgba(0,232,122,0.26) 357deg,
      rgba(0,232,122,0.55) 360deg);
  }
  .sweep-trail {
    background: conic-gradient(from 0deg,
      transparent 0 280deg,
      rgba(0,232,122,0.015) 312deg,
      rgba(0,232,122,0.05) 338deg,
      transparent 360deg);
  }
  @keyframes radar-sweep { to { transform: rotate(360deg); } }
  .radar-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 16px var(--green), 0 0 4px var(--green); z-index: 5;
  }
  #blips { position: absolute; inset: 0; pointer-events: none; }
  .blip {
    position: absolute; width: 9px; height: 9px; border-radius: 50%;
    transform: translate(-50%,-50%); cursor: pointer; z-index: 6;
    pointer-events: auto; opacity: 0;
    animation: blip-in 0.35s ease forwards, blip-pulse 2.6s ease-in-out infinite;
  }
  .blip.green { background: var(--green); box-shadow: 0 0 11px var(--green), 0 0 3px var(--green); }
  .blip.amber { background: var(--amber); box-shadow: 0 0 11px var(--amber), 0 0 3px var(--amber); }
  .blip.red   { background: var(--red);   box-shadow: 0 0 9px var(--red); }
  @keyframes blip-in { to { opacity: 1; } }
  @keyframes blip-pulse {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50% { transform: translate(-50%,-50%) scale(1.5); }
  }
  .blip-ring {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    transform: translate(-50%,-50%); z-index: 5; opacity: 0;
    animation: blip-ring 2.6s ease-out infinite;
  }
  .blip-ring.green { border: 1px solid var(--green); }
  .blip-ring.amber { border: 1px solid var(--amber); }
  .blip-ring.red   { border: 1px solid var(--red); }
  @keyframes blip-ring {
    0% { transform: translate(-50%,-50%) scale(0.4); opacity: 0.7; }
    100% { transform: translate(-50%,-50%) scale(2.4); opacity: 0; }
  }
  .radar-stats { display: flex; width: 100%; border: 1px solid var(--line-bright); }
  .rstat {
    flex: 1; padding: 11px 12px; text-align: center;
    border-right: 1px solid var(--line-bright);
  }
  .rstat:last-child { border-right: none; }
  .rstat-val {
    font-family: 'Aldrich', sans-serif; font-size: 21px; color: var(--green);
    text-shadow: 0 0 18px rgba(0,232,122,0.45); line-height: 1; margin-bottom: 5px;
  }
  .rstat-lbl { font-size: 7.5px; letter-spacing: 0.12em; color: var(--ink-faint); text-transform: uppercase; }

  /* section headings */
  .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .section-head-line { flex: 1; height: 1px; background: var(--line); }
  .section-head-line.bright { background: var(--line-bright); }
  .section-id {
    font-size: 8.5px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--green); white-space: nowrap;
  }

  /* intel brief */
  .intel-section { margin-bottom: 30px; }
  .intel-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .intel-panel {
    background: var(--bg-card); border: 1px solid var(--line-bright);
    border-top: 2px solid; padding: 14px 14px 12px;
    opacity: 0; animation: rise .5s ease forwards;
  }
  .intel-panel.trends { border-top-color: var(--green); }
  .intel-panel.certs  { border-top-color: var(--amber); }
  .intel-panel.news   { border-top-color: var(--ice); }
  .intel-panel-head {
    font-family: 'Aldrich', sans-serif; font-size: 11px;
    letter-spacing: 0.13em; text-transform: uppercase; margin-bottom: 11px;
  }
  .intel-panel-head.trends { color: var(--green); }
  .intel-panel-head.certs  { color: var(--amber); }
  .intel-panel-head.news   { color: var(--ice); }
  .intel-item { padding: 8px 0; border-bottom: 1px solid var(--ink-faint); }
  .intel-item:last-child { border-bottom: none; padding-bottom: 0; }
  .trend-label { font-size: 9.5px; letter-spacing: 0.07em; color: var(--green); text-transform: uppercase; margin-bottom: 3px; }
  .trend-detail { font-size: 12px; color: var(--ink-dim); line-height: 1.55; }
  .cert-name { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 600; color: var(--ink); }
  .cert-provider { font-size: 8.5px; letter-spacing: 0.08em; color: var(--amber); text-transform: uppercase; margin: 1px 0 3px; }
  .cert-why { font-size: 11.5px; color: var(--ink-dim); line-height: 1.5; }
  .news-headline { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 600; font-style: italic; color: var(--ink); margin-bottom: 3px; }
  .news-summary { font-size: 11.5px; color: var(--ink-dim); line-height: 1.5; }

  /* signals header */
  .sort-btns { display: flex; gap: 6px; }
  .sort-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
    letter-spacing: 0.08em; text-transform: uppercase;
    background: transparent; color: var(--ink-dim);
    border: 1px solid var(--ink-faint); padding: 5px 9px;
    cursor: pointer; transition: all .15s;
  }
  .sort-btn.active { background: var(--green-dim); color: var(--green); border-color: var(--green); }

  /* job card */
  .card {
    background: var(--bg-card); border: 1px solid var(--line-bright);
    border-left: 3px solid; padding: 14px 14px 12px; margin-bottom: 8px;
    cursor: pointer; position: relative; opacity: 0;
    transform: translateY(8px); animation: rise .4s ease forwards;
    transition: background .15s, border-color .15s, box-shadow .25s;
  }
  .card.score-green { border-left-color: var(--green); }
  .card.score-amber { border-left-color: var(--amber); }
  .card.score-red   { border-left-color: var(--red); }
  .card:hover { background: var(--bg-card-hover); }
  .card.active-blip { border-color: var(--green); box-shadow: 0 0 22px rgba(0,232,122,0.18); }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .card-meta-left { flex: 1; min-width: 0; }
  .signal-id { font-size: 8px; letter-spacing: 0.13em; color: var(--ink-faint); text-transform: uppercase; margin-bottom: 3px; }
  .company-name {
    font-size: 10px; letter-spacing: 0.09em; color: var(--ink-dim);
    text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .score-block { text-align: right; flex-shrink: 0; }
  .score-num { font-family: 'Aldrich', sans-serif; font-size: 27px; line-height: 1; }
  .score-num.green { color: var(--green); text-shadow: 0 0 18px rgba(0,232,122,0.4); }
  .score-num.amber { color: var(--amber); text-shadow: 0 0 18px rgba(255,170,0,0.4); }
  .score-num.red   { color: var(--red); }
  .score-lbl { font-size: 7px; letter-spacing: 0.13em; color: var(--ink-faint); text-transform: uppercase; }
  .card-title {
    font-family: 'Cormorant Garamond', serif; font-size: 20px;
    font-weight: 600; line-height: 1.25; color: var(--ink);
    padding-right: 58px; margin-bottom: 5px;
  }
  .card-loc { font-size: 9.5px; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 8px; }
  .card-verdict {
    font-size: 12px; color: var(--ink-dim); line-height: 1.55; font-style: italic;
    border-left: 2px solid var(--ink-faint); padding-left: 10px; margin-bottom: 10px;
  }
  .sig-bar { display: flex; gap: 3px; margin-bottom: 10px; }
  .sig-seg { height: 4px; flex: 1; background: var(--ink-faint); transition: background .3s; }
  .sig-seg.lit.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .sig-seg.lit.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .sig-seg.lit.red   { background: var(--red); }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .apply-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--bg); background: var(--green); border: none;
    padding: 8px 13px; text-decoration: none; display: inline-block;
    cursor: pointer; transition: opacity .15s, box-shadow .15s; flex-shrink: 0;
  }
  .apply-btn:hover { opacity: 0.85; box-shadow: 0 0 16px rgba(0,232,122,0.4); }
  .expand-hint { font-size: 8px; letter-spacing: 0.1em; color: var(--ink-faint); text-transform: uppercase; }
  .card-detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-bright); }
  .card.open .card-detail { display: block; }
  .fit-tag {
    display: inline-block; font-size: 8.5px; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 3px 8px; border: 1px solid; margin-bottom: 10px;
  }
  .fit-tag.good { color: var(--green); border-color: var(--green); }
  .fit-tag.stretch { color: var(--amber); border-color: var(--amber); }
  .fit-tag.mismatch { color: var(--red); border-color: var(--red); }
  .pc { list-style: none; margin-bottom: 8px; }
  .pc li { font-size: 11.5px; line-height: 1.55; color: var(--ink-dim); padding-left: 16px; position: relative; margin-bottom: 3px; }
  .pc.pro li::before { content: '+'; color: var(--green); position: absolute; left: 2px; font-weight: 700; }
  .pc.con li::before { content: '–'; color: var(--red); position: absolute; left: 4px; }

  /* states */
  .skel {
    height: 120px; margin-bottom: 8px; border: 1px solid var(--line);
    background: linear-gradient(100deg, var(--bg-card) 30%, rgba(0,232,122,0.04) 50%, var(--bg-card) 70%);
    background-size: 200% 100%; animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .msg { text-align: center; padding: 56px 20px; font-size: 12.5px; color: var(--ink-dim); }
  .msg .big { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--ink); display: block; margin-bottom: 8px; }
  footer { margin-top: 38px; text-align: center; font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="logo">JOB RADAR <span class="logo-cursor"></span></div>
      <div class="logo-sub">Signal Acquisition System &middot; HYD, India</div>
    </div>
    <div class="header-right">
      <div class="mode-badge"><span class="mode-dot"></span> Active Scan</div>
      <div class="stat-pills" id="statusbar"><span class="pill">loading&hellip;</span></div>
    </div>
  </header>

  <section class="radar-section">
    <div class="radar-wrap">
      <svg class="radar-svg" viewBox="0 0 264 264" fill="none">
        <circle cx="132" cy="132" r="126" stroke="rgba(0,232,122,0.12)" stroke-width="0.75"/>
        <circle cx="132" cy="132" r="95"  stroke="rgba(0,232,122,0.1)"  stroke-width="0.5"/>
        <circle cx="132" cy="132" r="63"  stroke="rgba(0,232,122,0.08)" stroke-width="0.5"/>
        <circle cx="132" cy="132" r="32"  stroke="rgba(0,232,122,0.06)" stroke-width="0.5"/>
        <line x1="6" y1="132" x2="258" y2="132" stroke="rgba(0,232,122,0.1)" stroke-width="0.5"/>
        <line x1="132" y1="6" x2="132" y2="258" stroke="rgba(0,232,122,0.1)" stroke-width="0.5"/>
        <line x1="43" y1="43" x2="221" y2="221" stroke="rgba(0,232,122,0.04)" stroke-width="0.5"/>
        <line x1="221" y1="43" x2="43" y2="221" stroke="rgba(0,232,122,0.04)" stroke-width="0.5"/>
        <path d="M6 30 L6 6 L30 6" stroke="rgba(0,232,122,0.35)" stroke-width="1"/>
        <path d="M234 6 L258 6 L258 30" stroke="rgba(0,232,122,0.35)" stroke-width="1"/>
        <path d="M258 234 L258 258 L234 258" stroke="rgba(0,232,122,0.35)" stroke-width="1"/>
        <path d="M30 258 L6 258 L6 234" stroke="rgba(0,232,122,0.35)" stroke-width="1"/>
        <text x="136" y="20" fill="rgba(0,232,122,0.4)" font-size="7" font-family="JetBrains Mono">N</text>
        <text x="136" y="255" fill="rgba(0,232,122,0.4)" font-size="7" font-family="JetBrains Mono">S</text>
        <text x="246" y="136" fill="rgba(0,232,122,0.4)" font-size="7" font-family="JetBrains Mono">E</text>
        <text x="12" y="136" fill="rgba(0,232,122,0.4)" font-size="7" font-family="JetBrains Mono">W</text>
      </svg>
      <div class="sweep-trail"></div>
      <div class="sweep"></div>
      <div id="blips"></div>
      <div class="radar-center"></div>
    </div>
    <div class="radar-stats">
      <div class="rstat"><div class="rstat-val" id="stat-scanned">&mdash;</div><div class="rstat-lbl">Scanned</div></div>
      <div class="rstat"><div class="rstat-val" id="stat-signals">&mdash;</div><div class="rstat-lbl">Acquired</div></div>
      <div class="rstat"><div class="rstat-val" id="stat-last">&mdash;</div><div class="rstat-lbl">Last Scan</div></div>
    </div>
  </section>

  <section class="intel-section" id="insights">
    <div class="section-head">
      <div class="section-id">// intel brief</div>
      <div class="section-head-line"></div>
    </div>
    <div class="skel" style="height:160px"></div>
  </section>

  <div class="section-head">
    <div class="section-id">// acquired signals</div>
    <div class="section-head-line bright"></div>
    <div class="sort-btns">
      <button class="sort-btn active" data-s="score">Match</button>
      <button class="sort-btn" data-s="new">Latest</button>
    </div>
  </div>

  <main id="board">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </main>

  <footer>Job Radar &middot; Scanning Daily &middot; Hyderabad, India</footer>
</div>

<script>
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtDate = iso => {
    if (!iso || iso === 'sample' || iso === '2000-01-01') return '\u2014';
    const d = new Date(iso);
    return isNaN(d) ? '\u2014' : d.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
  };
  const scoreClass = s => s >= 85 ? 'green' : s >= 70 ? 'amber' : 'red';
  let JOBS = [], sortMode = 'score';

  function renderBlips(jobs) {
    const wrap = document.getElementById('blips');
    if (!wrap) return;
    if (!jobs.length) { wrap.innerHTML = ''; return; }
    const cx = 132, cy = 132, maxR = 112;
    wrap.innerHTML = jobs.map((j, i) => {
      const angle = (i / jobs.length) * 2 * Math.PI - Math.PI / 2;
      const dist = 0.24 + (1 - Math.min(j.score, 100) / 100) * 0.66;
      const x = cx + Math.cos(angle) * maxR * dist;
      const y = cy + Math.sin(angle) * maxR * dist;
      const cls = scoreClass(j.score);
      const delay = 700 + i * 170;
      return `<div class="blip-ring ${cls}" style="left:${x}px;top:${y}px;animation-delay:${delay+120}ms"></div>
        <div class="blip ${cls}" title="${esc(j.title)} \u00b7 ${j.score}"
             style="left:${x}px;top:${y}px;animation-delay:${delay}ms"
             onclick="focusCard('${esc(j.hash)}')"></div>`;
    }).join('');
  }
  window.focusCard = function (hash) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active-blip'));
    const card = document.querySelector('.card[data-hash="' + hash + '"]');
    if (!card) return;
    card.classList.add('active-blip');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => card.classList.remove('active-blip'), 2600);
  };

  function renderStatus(meta) {
    const sb = document.getElementById('statusbar');
    const last = meta && meta.lastRun ? fmtDate(meta.lastRun) : 'pending';
    sb.innerHTML = '<span class="pill">scan <b>' + esc(last) + '</b></span>' +
      '<span class="pill">signals <b>' + JOBS.length + '</b></span>';
    document.getElementById('stat-scanned').textContent = (meta && meta.scanned != null) ? meta.scanned : '\u2014';
    document.getElementById('stat-signals').textContent = JOBS.length;
    document.getElementById('stat-last').textContent = (meta && meta.lastRun) ? fmtDate(meta.lastRun) : '\u2014';
    document.querySelectorAll('.sort-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.s === sortMode);
      b.onclick = () => { sortMode = b.dataset.s; renderBoard(); };
    });
  }

  function sigBar(score, cls) {
    const segs = 12, lit = Math.round((Math.min(score,100) / 100) * segs);
    let h = '';
    for (let i = 0; i < segs; i++) h += '<div class="sig-seg' + (i < lit ? ' lit ' + cls : '') + '"></div>';
    return h;
  }

  function cardHTML(j, i) {
    const cls = scoreClass(j.score);
    const fit = ['good','stretch','mismatch'].includes(j.seniorityFit) ? j.seniorityFit : 'stretch';
    const pros = (j.pros || []).map(p => '<li>' + esc(p) + '</li>').join('');
    const cons = (j.cons || []).map(c => '<li>' + esc(c) + '</li>').join('');
    const sigId = 'SIG-' + String(i + 1).padStart(3, '0');
    return `<article class="card score-${cls}" data-hash="${esc(j.hash)}" style="animation-delay:${i*50}ms">
      <div class="card-top">
        <div class="card-meta-left">
          <div class="signal-id">${sigId} \u00b7 ${esc(j.source)}</div>
          <div class="company-name">${esc(j.company)}</div>
        </div>
        <div class="score-block">
          <div class="score-num ${cls}">${j.score}</div>
          <div class="score-lbl">Sig Str</div>
        </div>
      </div>
      <div class="card-title">${esc(j.title)}</div>
      <div class="card-loc">${esc(j.location || '\u2014')} \u00b7 posted ${fmtDate(j.postedAt)}</div>
      <div class="card-verdict">${esc(j.verdict)}</div>
      <div class="sig-bar">${sigBar(j.score, cls)}</div>
      <div class="card-foot">
        <a class="apply-btn" href="${esc(j.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Apply now \u203a</a>
        <span class="expand-hint" data-hint>\u25be Decode</span>
      </div>
      <div class="card-detail">
        <span class="fit-tag ${fit}">Seniority: ${esc((j.seniorityFit||'unknown').toUpperCase())}</span>
        ${pros ? '<ul class="pc pro">' + pros + '</ul>' : ''}
        ${cons ? '<ul class="pc con">' + cons + '</ul>' : ''}
      </div>
    </article>`;
  }

  function sortJobs(list) {
    const a = [...list];
    return sortMode === 'score'
      ? a.sort((x,y) => y.score - x.score)
      : a.sort((x,y) => String(y.firstSeen).localeCompare(String(x.firstSeen)) || y.score - x.score);
  }

  function renderBoard() {
    renderStatus(window.__meta);
    const board = document.getElementById('board');
    const sorted = sortJobs(JOBS);
    if (!JOBS.length) {
      board.innerHTML = '<div class="msg"><span class="big">No signals acquired</span>Run the workflow to populate the board.</div>';
      renderBlips([]);
      return;
    }
    board.innerHTML = sorted.map(cardHTML).join('');
    board.querySelectorAll('.card').forEach(c => {
      c.addEventListener('click', e => {
        if (e.target.closest('.apply-btn')) return;
        c.classList.toggle('open');
        const h = c.querySelector('[data-hint]');
        if (h) h.textContent = c.classList.contains('open') ? '\u25b4 Close' : '\u25be Decode';
      });
    });
    renderBlips(sorted);
  }

  function renderInsights(d) {
    const sec = document.getElementById('insights');
    const headOnly = '<div class="section-head"><div class="section-id">// intel brief</div><div class="section-head-line"></div></div>';
    if (!d || (!d.trends && !d.certifications && !d.news)) { sec.innerHTML = headOnly; return; }
    const trends = (d.trends || []).map(t =>
      '<div class="intel-item"><div class="trend-label">' + esc(t.label) + '</div><div class="trend-detail">' + esc(t.detail) + '</div></div>').join('');
    const certs = (d.certifications || []).map(c =>
      '<div class="intel-item"><div class="cert-name">' + esc(c.name) + '</div><div class="cert-provider">' + esc(c.provider) + '</div><div class="cert-why">' + esc(c.why) + '</div></div>').join('');
    const news = (d.news || []).map(n =>
      '<div class="intel-item"><div class="news-headline">' + esc(n.headline) + '</div><div class="news-summary">' + esc(n.summary) + '</div></div>').join('');
    sec.innerHTML =
      '<div class="section-head"><div class="section-id">// intel brief \u00b7 ' + esc(d.generatedAt || 'today') + '</div><div class="section-head-line"></div></div>' +
      '<div class="intel-grid">' +
        '<div class="intel-panel trends" style="animation-delay:0ms"><div class="intel-panel-head trends">\u25b2 Market Trends</div>' + (trends || '<div class="trend-detail">Run agent to generate.</div>') + '</div>' +
        '<div class="intel-panel certs" style="animation-delay:80ms"><div class="intel-panel-head certs">\u25c8 Certifications Worth Getting</div>' + (certs || '<div class="cert-why">Run agent to generate.</div>') + '</div>' +
        '<div class="intel-panel news" style="animation-delay:160ms"><div class="intel-panel-head news">\u25c9 Product &amp; Fintech News</div>' + (news || '<div class="news-summary">Run agent to generate.</div>') + '</div>' +
      '</div>';
  }

  fetch('./data/insights.json?t=' + Date.now())
    .then(r => r.ok ? r.json() : null).then(renderInsights).catch(() => renderInsights(null));

  fetch('./data/results.json?t=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('no data'); return r.json(); })
    .then(data => {
      window.__meta = data.meta || {};
      JOBS = (data.jobs || []).filter(j => j.firstSeen !== '2000-01-01');
      renderBoard();
    })
    .catch(() => {
      document.getElementById('statusbar').innerHTML = '<span class="pill">no signal</span>';
      document.getElementById('board').innerHTML =
        '<div class="msg"><span class="big">No signal acquired</span>Run the workflow once to generate data/results.json.</div>';
      renderBlips([]);
    });
</script>
</body>
</html>
